<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos a Concretar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tierra: #2a1f16;
    --musgo: #3d5230;
    --paja: #c8a96e;
    --crema: #f0e8d8;
    --madera: #6b4f35;
    --acento: #c4521a;
    --verde: #7aaa5e;
    --rojo: #b94040;
    --amarillo: #d4a017;
    --panel: rgba(255,255,255,0.04);
    --border: rgba(200,169,110,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--tierra);
    background-image:
      radial-gradient(ellipse at 15% 85%, rgba(61,82,48,0.35) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 10%, rgba(200,169,110,0.12) 0%, transparent 50%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
    font-family: 'Courier Prime', monospace;
    min-height: 100vh;
    padding: 36px 16px 60px;
    color: var(--crema);
  }

  .container { max-width: 780px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 36px; }
  .hline { height: 1px; background: linear-gradient(to right, transparent, var(--paja), transparent); margin: 10px 0; }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 900; color: var(--paja);
    text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.1;
  }
  .subtitle { font-size: 0.68rem; letter-spacing: 0.3em; color: var(--madera); text-transform: uppercase; margin-top: 5px; }

  /* SUMMARY */
  .summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 26px; }
  .sum-card { background: var(--panel); border: 1px solid var(--border); border-radius: 3px; padding: 12px 14px; text-align: center; }
  .sum-label { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--madera); }
  .sum-value { font-family: 'Playfair Display', serif; font-size: 1.35rem; color: var(--paja); margin-top: 2px; }
  .sum-value.green { color: var(--verde); }
  .prog-wrap { background: rgba(255,255,255,0.05); border-radius: 2px; height: 4px; margin-top: 8px; overflow: hidden; }
  .prog-bar { height: 100%; background: linear-gradient(to right, var(--musgo), var(--verde)); transition: width 0.5s ease; }

  /* CARDS */
  .projects { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 4px; overflow: hidden;
    animation: fadeUp 0.4s ease both;
    transition: border-color 0.25s;
  }
  .card:hover { border-color: rgba(200,169,110,0.35); }
  .card.done { opacity: 0.5; }
  .card.done .card-title { text-decoration: line-through; color: var(--madera); }
  .card.p-alta  { border-left: 4px solid var(--rojo); }
  .card.p-media { border-left: 4px solid var(--amarillo); }
  .card.p-baja  { border-left: 4px solid var(--musgo); }

  .card:nth-child(1){animation-delay:.05s} .card:nth-child(2){animation-delay:.10s}
  .card:nth-child(3){animation-delay:.15s} .card:nth-child(4){animation-delay:.20s}
  .card:nth-child(5){animation-delay:.25s}

  /* HEADER ROW */
  .card-header { display: flex; align-items: center; gap: 12px; padding: 15px 16px; cursor: pointer; user-select: none; }

  .cb {
    width: 21px; height: 21px; border: 2px solid var(--paja); border-radius: 2px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: white; transition: all 0.2s;
  }
  .card.done .cb { background: var(--verde); border-color: var(--verde); }

  .card-icon { font-size: 1.4rem; flex-shrink: 0; }
  .card-meta { flex: 1; min-width: 0; }
  .card-title { font-family: 'Playfair Display', serif; font-size: 1.02rem; font-weight: 700; color: var(--crema); transition: color 0.2s; }

  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .tag {
    font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 20px; border: 1px solid;
  }
  .tag.p-alta  { border-color: var(--rojo);    color: var(--rojo); }
  .tag.p-media { border-color: var(--amarillo); color: var(--amarillo); }
  .tag.p-baja  { border-color: var(--verde);   color: var(--verde); }
  .tag.info    { border-color: rgba(200,169,110,0.35); color: var(--paja); }

  .toggle-btn { font-size: 0.9rem; color: var(--madera); transition: transform 0.3s; flex-shrink: 0; }
  .card.open .toggle-btn { transform: rotate(180deg); }

  /* BODY */
  .card-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
  .card.open .card-body { max-height: 700px; }

  .card-inner {
    padding: 14px 16px 16px;
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  @media(max-width:520px){ .card-inner{ grid-template-columns:1fr; } }

  .sec-label { font-size: 0.58rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--madera); margin-bottom: 8px; }

  /* Insumos */
  .insumos-list { list-style: none; }
  .insumo-row { display: flex; align-items: baseline; gap: 6px; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .insumo-row::before { content: '—'; color: var(--madera); flex-shrink: 0; }
  .insumo-text {
    font-size: 0.78rem; color: var(--crema); flex: 1;
    background: none; border: none; outline: none; font-family: inherit;
    padding: 0; cursor: text;
  }
  .insumo-del { background: none; border: none; color: var(--madera); cursor: pointer; font-size: 0.8rem; padding: 0 2px; opacity: 0.5; }
  .insumo-del:hover { color: var(--rojo); opacity: 1; }
  .add-insumo { font-size: 0.62rem; color: var(--madera); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; margin-top: 7px; display: inline-block; }
  .add-insumo:hover { color: var(--paja); }

  /* Detail */
  .detail-grid { display: flex; flex-direction: column; gap: 9px; }
  .detail-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .detail-key { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--madera); white-space: nowrap; }

  .field {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(200,169,110,0.15);
    border-radius: 2px; color: var(--crema); font-family: 'Courier Prime', monospace;
    font-size: 0.78rem; padding: 3px 7px; outline: none;
    transition: border-color 0.2s; text-align: right;
  }
  .field:focus { border-color: var(--paja); }
  select.field { cursor: pointer; }

  /* Notes */
  .notes-section { grid-column: 1 / -1; }
  .notes-area {
    font-size: 0.76rem; color: rgba(240,232,216,0.55); line-height: 1.6;
    font-style: italic; font-family: 'Courier Prime', monospace;
    background: none; border: none; border-bottom: 1px dashed rgba(200,169,110,0.2);
    width: 100%; resize: none; outline: none; padding: 4px 2px;
  }
  .notes-area:focus { border-bottom-color: rgba(200,169,110,0.5); color: var(--crema); }

  /* Add project */
  .add-project-btn {
    width: 100%; margin-top: 14px;
    background: none; border: 1px dashed rgba(200,169,110,0.25);
    border-radius: 3px; padding: 12px;
    color: var(--madera); font-family: 'Courier Prime', monospace;
    font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s;
  }
  .add-project-btn:hover { border-color: var(--paja); color: var(--paja); }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(12px); }
    to   { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="hline"></div>
    <h1>Proyectos<br>a Concretar</h1>
    <p class="subtitle">Planificación · Insumos · Costos · Tiempos</p>
    <div class="hline"></div>
  </header>

  <div class="summary">
    <div class="sum-card">
      <div class="sum-label">Completados</div>
      <div class="sum-value green" id="s-done">0 / 5</div>
      <div class="prog-wrap"><div class="prog-bar" id="s-bar" style="width:0%"></div></div>
    </div>
    <div class="sum-card">
      <div class="sum-label">Costo Total</div>
      <div class="sum-value" id="s-costo">$0</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">Tiempo Total</div>
      <div class="sum-value" id="s-tiempo">0 días</div>
    </div>
  </div>

  <div class="projects" id="lista"></div>
  <button class="add-project-btn" onclick="addProject()">+ Agregar proyecto</button>

</div>
<script>
let data = [
  {
    icono:'🌿', nombre:'Invernadero',
    prioridad:'alta', fecha:'2025-09', tiempo:'15', costo:'180000',
    insumos:['Estructura metálica (caños)','Film plástico UV','Malla media sombra','Canales de riego','Tornillos y anclajes','Puerta y bisagras'],
    notas:'Elegir orientación norte-sur para mejor aprovechamiento solar. Revisar nivelación del terreno antes de comenzar.',
    done:false, open:false
  },
  {
    icono:'📦', nombre:'Bodega (contenedor)',
    prioridad:'alta', fecha:'2025-08', tiempo:'7', costo:'220000',
    insumos:['Contenedor 20 pies','Pintura anticorrosión','Aislación interior (telgopor/lana)','Puerta reforzada','Rejillas de ventilación','Iluminación LED','Estanterías metálicas'],
    notas:'Nivelar con bloques de hormigón. Orientar para evitar sol directo en verano. Verificar acceso para carga.',
    done:false, open:false
  },
  {
    icono:'🔧', nombre:'Taller',
    prioridad:'media', fecha:'2025-10', tiempo:'10', costo:'95000',
    insumos:['Mesada de trabajo','Tablero perforado para herramientas','Tomacorrientes trifásicos','Iluminación fluorescente','Cajones y organizadores','Tornillo de banco'],
    notas:'Planificar instalación eléctrica antes de equipar. Reservar espacio central para maquinaria pesada.',
    done:false, open:false
  },
  {
    icono:'🌲', nombre:'Talar los eucaliptos',
    prioridad:'media', fecha:'2025-07', tiempo:'4', costo:'45000',
    insumos:['Motosierra + combustible y cadena de repuesto','Cuñas de tala','Casco, guantes, protección facial','Sogas de guía','Tractor o zorra para traslado de troncos'],
    notas:'Contratar ayuda para árboles de mayor porte. Verificar dirección de caída y zona despejada. Chequear vientos.',
    done:false, open:false
  },
  {
    icono:'🪓', nombre:'Cortar y ordenar leña',
    prioridad:'baja', fecha:'2025-11', tiempo:'3', costo:'12000',
    insumos:['Motosierra','Hacha y maza','Cuñas de madera','Guantes de trabajo','Lona para cubrir leñera'],
    notas:'Cortar en largos de 35–40 cm. Apilar con ventilación entre filas para secado. Cubrir solo la parte superior.',
    done:false, open:false
  }
];

function fmt(n){ return '$'+Number(n||0).toLocaleString('es-AR'); }

function updateSummary(){
  const total = data.length;
  const done  = data.filter(p=>p.done).length;
  const costo = data.reduce((a,p)=>a+(+p.costo||0),0);
  const dias  = data.reduce((a,p)=>{ const m=String(p.tiempo).match(/(\d+)/); return a+(m?+m[1]:0); },0);
  document.getElementById('s-done').textContent  = done+' / '+total;
  document.getElementById('s-bar').style.width   = (total?done/total*100:0)+'%';
  document.getElementById('s-costo').textContent = fmt(costo);
  document.getElementById('s-tiempo').textContent= dias+' días';
}

function render(){
  const lista = document.getElementById('lista');
  lista.innerHTML='';
  data.forEach((p,i)=>{
    const card = document.createElement('div');
    card.className=`card p-${p.prioridad}${p.done?' done':''}${p.open?' open':''}`;
    card.innerHTML=`
      <div class="card-header" onclick="toggleOpen(${i})">
        <div class="cb" onclick="toggleDone(event,${i})">${p.done?'✓':''}</div>
        <div class="card-icon">${p.icono}</div>
        <div class="card-meta">
          <div class="card-title">${p.nombre}</div>
          <div class="tags">
            <span class="tag p-${p.prioridad}">▲ ${p.prioridad}</span>
            <span class="tag info">📅 ${p.fecha||'—'}</span>
            <span class="tag info">⏱ ${p.tiempo||'0'} días</span>
            <span class="tag info">💲 ${fmt(p.costo)}</span>
          </div>
        </div>
        <span class="toggle-btn">▾</span>
      </div>
      <div class="card-body">
        <div class="card-inner">
          <div>
            <div class="sec-label">Insumos / Materiales</div>
            <ul class="insumos-list" id="ins-${i}">
              ${p.insumos.map((ins,j)=>`
                <li class="insumo-row">
                  <input class="insumo-text" value="${ins}" onchange="data[${i}].insumos[${j}]=this.value">
                  <button class="insumo-del" onclick="delInsumo(${i},${j})">✕</button>
                </li>`).join('')}
            </ul>
            <span class="add-insumo" onclick="addInsumo(${i})">+ agregar insumo</span>
          </div>
          <div class="detail-grid">
            <div class="sec-label">Detalles del proyecto</div>
            <div class="detail-row">
              <span class="detail-key">Prioridad</span>
              <select class="field" onchange="setField(${i},'prioridad',this.value);render()">
                <option ${p.prioridad==='alta'?'selected':''} value="alta">Alta</option>
                <option ${p.prioridad==='media'?'selected':''} value="media">Media</option>
                <option ${p.prioridad==='baja'?'selected':''} value="baja">Baja</option>
              </select>
            </div>
            <div class="detail-row">
              <span class="detail-key">Fecha estimada</span>
              <input class="field" type="month" value="${p.fecha}" style="color-scheme:dark" onchange="setField(${i},'fecha',this.value)">
            </div>
            <div class="detail-row">
              <span class="detail-key">Duración (días)</span>
              <input class="field" type="number" min="0" value="${p.tiempo}" style="width:70px" onchange="setField(${i},'tiempo',this.value)">
            </div>
            <div class="detail-row">
              <span class="detail-key">Costo ($)</span>
              <input class="field" type="number" min="0" value="${p.costo}" style="width:110px" onchange="setField(${i},'costo',this.value)">
            </div>
            <div class="detail-row" style="margin-top:6px;justify-content:flex-end">
              <button onclick="deleteProject(${i})" style="background:none;border:1px solid rgba(185,64,64,0.4);border-radius:2px;color:var(--rojo);font-family:inherit;font-size:0.6rem;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;cursor:pointer;opacity:.7">eliminar proyecto</button>
            </div>
          </div>
          <div class="notes-section">
            <div class="sec-label">Notas</div>
            <textarea class="notes-area" rows="2" onchange="setField(${i},'notas',this.value)">${p.notas}</textarea>
          </div>
        </div>
      </div>`;
    lista.appendChild(card);
  });
  updateSummary();
}

function toggleOpen(i){ data[i].open=!data[i].open; render(); }
function toggleDone(e,i){ e.stopPropagation(); data[i].done=!data[i].done; render(); }
function setField(i,k,v){ data[i][k]=v; updateSummary(); }
function addInsumo(i){ data[i].insumos.push('Nuevo insumo'); render(); }
function delInsumo(i,j){ data[i].insumos.splice(j,1); render(); }
function deleteProject(i){ if(confirm('¿Eliminar este proyecto?')){ data.splice(i,1); render(); } }
function addProject(){
  data.push({ icono:'📋', nombre:'Nuevo proyecto', prioridad:'media', fecha:'', tiempo:'1', costo:'0', insumos:['Insumo 1'], notas:'', done:false, open:true });
  render();
}

render();
</script>
</body>
</html>
